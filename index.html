<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыка для выхода — Турнир памяти Николая Путина</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 50% 0%, #0a2818 0%, #060a08 55%, #040404 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 540px;
    background: rgba(12, 20, 15, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 22px;
    padding: 44px 40px 40px;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.65),
      0 0 100px rgba(34, 197, 94, 0.07);
    position: relative;
    overflow: hidden;
  }

  /* Лёгкое свечение сверху карточки */
  .card::before {
    content: '';
    position: absolute;
    top: -60%;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(34,197,94,0.16) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Блок с логотипом и названием */
  .tournament {
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
  }

  .logo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .logo-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 15%; /* Центрируем лицо */
    border: 3px solid #22c55e;
    box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
    background: #fff; /* Белый фон для контраста черных линий */
  }

  .tournament-label {
    display: inline-block;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #22c55e;
    padding: 4px 12px;
    border: 1px solid rgba(34, 197, 94, 0.35);
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .tournament-title {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.35;
    color: #e8f5ee;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .tournament-title strong { color: #22c55e; font-weight: 700; }

  /* Разделитель */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 28px;
    position: relative;
    z-index: 1;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(34,197,94,0.35), transparent);
  }
  .divider span { color: #22c55e; font-size: 14px; }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    line-height: 1.15;
    margin-bottom: 10px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  h1 span { color: #22c55e; }

  .subtitle {
    color: #8a9c92;
    font-size: 14px;
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    color: #c9d6ce;
    letter-spacing: 0.3px;
  }

  select, input {
    width: 100%;
    padding: 14px 16px;
    background: #0a1410;
    border: 2px solid #1e2e25;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #22c55e;
    background: #0d1a13;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
  }
  select option { background: #0a1410; color: #fff; }

  .field { margin-bottom: 22px; position: relative; z-index: 1; }

  .hint {
    font-size: 12px;
    color: #6b7f73;
    margin-top: 8px;
    padding-left: 2px;
  }

  /* Превью плеера */
  .preview-wrap {
    display: none;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
  }
  .preview-wrap.visible { display: block; }

  .preview-label {
    font-size: 12px;
    color: #6b7f73;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .preview-frame {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(34, 197, 94, 0.25);
    background: #0a1410;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  #trackPreview {
    display: block;
    border: none;
  }

  button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: #04140a;
    border: none;
    border-radius: 12px;
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.25s, filter 0.2s;
    position: relative;
    z-index: 1;
    margin-top: 6px;
  }
  button:hover {
    box-shadow: 0 10px 34px rgba(34, 197, 94, 0.35);
    filter: brightness(1.05);
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: wait; }

  .success {
    display: none;
    text-align: center;
    padding: 24px 0 8px;
    position: relative;
    z-index: 1;
  }
  .success-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.12);
    border: 2px solid #22c55e;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 30px;
  }
  .success h2 {
    font-family: 'Oswald', sans-serif;
    color: #22c55e;
    font-size: 24px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .success p { color: #9aada1; font-size: 14px; }

  @media (max-width: 480px) {
    .card { padding: 32px 22px 28px; }
    h1 { font-size: 24px; }
    .tournament-title { font-size: 14px; }
    .logo-img { width: 100px; height: 100px; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- Название турнира и ЛОГОТИП -->
  <div class="tournament">
    <div class="logo-wrapper">
      <!-- ВАЖНО: сохраните картинку как logo.png в той же папке -->
      <img src="logo.png" alt="Логотип турнира" class="logo-img">
    </div>
    
    <span class="tournament-label">МУЗЫКА ДЛЯ ВЫХОДА</span>
    <p class="tournament-title">
      Межрегиональный турнир по боксу<br>
      памяти <strong>Николая Путина</strong>
    </p>
  </div>

  <div class="divider"><span>🥊</span></div>

  <h1>Выбери свою <span>музыку</span></h1>
  <p class="subtitle">Один боксёр — один трек. Вставь ссылку на песню с Яндекс.Музыки.</p>

  <form id="form">
    <div class="field">
      <label for="boxer">Кто ты?</label>
      <select id="boxer" required>
        <option value="" disabled selected>— Выбери своё имя —</option>
        
        <!-- Список боксёров из фото -->
        <option value="КУУЛАР Алаш">КУУЛАР Алаш (Тыва)</option>
        <option value="ФРЕЙЗЕ Виктор">ФРЕЙЗЕ Виктор (Новосибирская)</option>
        <option value="ЛЕНДИНАУ Александр">ЛЕНДИНАУ Александр (Томская)</option>
        <option value="НЕЧАЕВ Антон">НЕЧАЕВ Антон (Новосибирская)</option>
        <option value="ШУЛЬЦ Артем">ШУЛЬЦ Артем (Алтайский)</option>
        <option value="ГАСАНОВ Эмин">ГАСАНОВ Эмин (Томская)</option>
        <option value="НИКОЛАЕВ Алексей">НИКОЛАЕВ Алексей (Томская)</option>
        <option value="ГРОХОТОВ Матвей">ГРОХОТОВ Матвей (Саха-Якутия)</option>
        <option value="ЧЕРНОВ Виталий">ЧЕРНОВ Виталий (Томская)</option>
        
        <option value="ДАВЫДОВ Дмитрий">ДАВЫДОВ Дмитрий (Томская)</option>
        <option value="ООРЖАК Алим">ООРЖАК Алим (Новосибирская)</option>
        <option value="МУСТЮКОВ Захар">МУСТЮКОВ Захар (Томская)</option>
        <option value="МАТУСЕВИЧ Андрей">МАТУСЕВИЧ Андрей (Томская)</option>
        <option value="УСПЕНСКИЙ Георгий">УСПЕНСКИЙ Георгий (Новосибирская)</option>
        <option value="ТКАЧЕВ Игорь">ТКАЧЕВ Игорь (Новосибирская)</option>
        <option value="КАДОРКИН Егор">КАДОРКИН Егор (Томская)</option>
        <option value="ЧУБЕНКО Никита">ЧУБЕНКО Никита (Новосибирская)</option>
        <option value="СУХАНОВ Матвей">СУХАНОВ Матвей (Алтайский)</option>
      </select>
    </div>

    <div class="field">
      <label for="url">Ссылка на трек</label>
      <input type="url" id="url" placeholder="https://music.yandex.ru/album/.../track/..." required
             pattern="https?://music\.yandex\.(ru|com)/.*"
             title="Ссылка должна быть с music.yandex.ru">
      <p class="hint">Поделиться → «Ссылка на трек» (не на плейлист)</p>
    </div>

    <!-- Блок превью плеера -->
    <div class="preview-wrap" id="previewWrap">
      <p class="preview-label">Предпрослушивание</p>
      <div class="preview-frame">
        <iframe id="trackPreview" 
                src="" 
                width="100%" 
                height="180" 
                frameborder="0" 
                allow="clipboard-write">
        </iframe>
      </div>
    </div>

    <button type="submit" id="btn">Отправить</button>
  </form>

  <div class="success" id="success">
    <div class="success-icon">✓</div>
    <h2>Принято!</h2>
    <p>Твой трек сохранён. Увидимся на ринге 🥊</p>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyIdF-swamOtzKqbhLNNnqt1ZLDKbdwm9DhDOPXpCuNyGkSYOPWaFg9By_t4pZJjjHW/exec';

// --- Логика превью ---
const urlInput = document.getElementById('url');
const previewWrap = document.getElementById('previewWrap');
const trackPreview = document.getElementById('trackPreview');

// Регулярка для ссылок Яндекс.Музыки
const YM_REGEX = /music\.yandex\.(ru|com)\/(?:album\/(\d+)\/)?track\/(\d+)/;

function updatePreview() {
  const value = urlInput.value.trim();
  const match = value.match(YM_REGEX);

  if (match) {
    const albumId = match[2]; 
    const trackId = match[3];
    
    // Собираем ссылку для iframe
    const iframeSrc = albumId
      ? `https://music.yandex.ru/iframe/#track/${trackId}/${albumId}`
      : `https://music.yandex.ru/iframe/#track/${trackId}`;

    trackPreview.src = iframeSrc;
    previewWrap.classList.add('visible');
  } else {
    trackPreview.src = '';
    previewWrap.classList.remove('visible');
  }
}

// Дебаунс для ввода
let debounceTimer;
urlInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, 500);
});

// Мгновенная реакция на вставку из буфера
urlInput.addEventListener('paste', () => {
  setTimeout(updatePreview, 100);
});


// --- Логика отправки ---
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  const data = {
    boxer: document.getElementById('boxer').value,
    trackUrl: document.getElementById('url').value
  };

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify(data)
    });
    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  } catch (err) {
    alert('Ошибка отправки: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Отправить';
  }
});
</script>
</body>
</html>
